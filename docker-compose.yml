version: '3.8'

services:
  wms_service_api:
    build: .  # Путь к Dockerfile FastAPI
    container_name: wms_service_api
    image: ${WMS_IMAGE:-wms_service_api_image}
    # Runtime configuration stays outside the build context/image.
    env_file:
      - ${WMS_ENV_FILE:-.env}

    ports:
      - "8310:8010"
    networks:
      - vector_db_default  # Имя сети из docker inspect

networks:
  vector_db_default:
    external: true  # Используем существующую сеть